<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>争覇戦ポイント計算（完全OCR可変版）</title>

<!-- OCR -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
<!-- html2canvas（PNG出力） -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
:root{
  --bg:#0d0d11;
  --panel:#1e1e25;
  --fg:#eaeaea;
  --th:#2d2d37;
  --hl:#4d3b00;
  --accent:#288cff;
  --danger:#e04444;
  --gold:#cda11c;
}

body{
  margin:10px;
  background:var(--bg);
  color:var(--fg);
  font-family:"Segoe UI", Arial, sans-serif;
}

h1{
  text-align:center;
  color:#ffda7b;
  text-shadow:0 0 8px #5b3f00;
}

button{
  border:none;
  padding:10px 14px;
  border-radius:8px;
  cursor:pointer;
  color:#fff;
}

.blue{background:var(--accent)}
.red{background:var(--danger)}
.gold{background:var(--gold)}

.controls{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
  margin-bottom:10px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:var(--panel);
  box-shadow:0 5px 15px rgba(0,0,0,0.4);
}

th, td{
  border:1px solid rgba(255,255,255,0.07);
  padding:6px;
  text-align:center;
  font-size:14px;
}

th{ background:var(--th); }

input{
  width:90%;
  padding:4px 6px;
  border:none;
  border-radius:5px;
  font-size:14px;
}

.highlight{ background:var(--hl) !important; }

@media(max-width: 600px){
  th, td{ font-size:12px; padding:4px; }
  input{ font-size:12px }
}
</style>
</head>

<body>

<h1>争覇戦ポイント計算（完全OCR可変版）</h1>

<!-- 操作ボタン -->
<div class="controls">
  <button class="blue" onclick="sortTable(true)">▲ 昇順</button>
  <button class="red" onclick="sortTable(false)">▼ 降順</button>
  <button class="gold" onclick="exportImage()">📷 画像出力</button>
</div>

<!-- OCR入力 -->
<div style="text-align:center;">
  <label style="display:block;margin-bottom:6px;">📸 スクショを選択（左アイコン・右同盟名）</label>
  <input id="files" type="file" accept="image/*" multiple onchange="readImages()">
  <div id="status" style="margin-top:8px;font-size:14px;color:#ccc;"></div>
</div>

<!-- テーブル -->
<table id="table">
  <thead id="thead">
    <tr>
      <th>アイコン</th>
      <th>同盟名</th>
      <th>1日</th>
      <th>2日</th>
      <th>3日</th>
      <th>4日</th>
      <th>5日</th>
      <th>6日</th>
      <th>合計</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<script>
/* ============================================
   行追加（同盟データ 1件を行として作成）
============================================ */
function addRow(allianceName, iconData){
  const tbody = document.getElementById("tbody");
  const tr = document.createElement("tr");

  /* アイコン */
  const tdIcon = document.createElement("td");
  const img = document.createElement("img");
  img.src = iconData || "";
  img.style.width="40px";
  img.style.height="40px";
  tdIcon.appendChild(img);
  tr.appendChild(tdIcon);

  /* 同盟名 */
  const tdName = document.createElement("td");
  const inputName = document.createElement("input");
  inputName.type = "text";
  inputName.value = allianceName || "";
  inputName.oninput = ()=> calcRow(tr);
  tdName.onclick = ()=> tr.classList.toggle("highlight");
  tdName.appendChild(inputName);
  tr.appendChild(tdName);

  /* 日別ポイント（6日固定） */
  for(let d=1; d<=6; d++){
    const td = document.createElement("td");
    const input = document.createElement("input");
    input.type = "number";
    input.value = 0;
    input.oninput = ()=> calcRow(tr);
    td.appendChild(input);
    tr.appendChild(td);
  }

  /* 合計 */
  const tdTotal = document.createElement("td");
  tdTotal.textContent = 0;
  tr.appendChild(tdTotal);

  tbody.appendChild(tr);
}

/* ============================================
   行計算
============================================ */
function calcRow(tr){
  const cells = tr.querySelectorAll("td");
  let sum = 0;
  for(let i=2;i<=7;i++){
    sum += Number(cells[i].querySelector("input").value) || 0;
  }
  cells[8].textContent = sum;
}

/* ============================================
   並び替え
============================================ */
function sortTable(asc){
  const tbody = document.getElementById("tbody");
  const rows = Array.from(tbody.querySelectorAll("tr"));
  rows.sort((a,b)=>{
    const A = Number(a.querySelector("td:last-child").textContent) || 0;
    const B = Number(b.querySelector("td:last-child").textContent) || 0;
    return asc ? A-B : B-A;
  });
  rows.forEach(r=>tbody.appendChild(r));
}

/* ============================================
   PNG出力
============================================ */
function exportImage(){
  const table = document.getElementById("table");
  html2canvas(table, {scale:2}).then(canvas=>{
    const a = document.createElement("a");
    a.href = canvas.toDataURL("image/png");
    a.download = "争覇戦ポイント表.png";
    a.click();
  });
}

/* ============================================
   OCR前処理（2値化＋コントラスト強化）
============================================ */
function preprocess(img, crop){
  const c = document.createElement("canvas");
  c.width = crop.w;
  c.height = crop.h;
  const ctx = c.getContext("2d");

  ctx.drawImage(img, crop.x, crop.y, crop.w, crop.h,
                     0,    0,       crop.w, crop.h);

  const d = ctx.getImageData(0,0,c.width,c.height);
  const px = d.data;

  for(let i=0;i<px.length;i+=4){
    const L = 0.22*px[i] + 0.71*px[i+1] + 0.07*px[i+2];
    const v = L > 120 ? 255 : 0;
    px[i]=px[i+1]=px[i+2]=v;
  }

  ctx.putImageData(d,0,0);
  return c.toDataURL();
}

/* ============================================
   左アイコン＋右同盟名の行を自動検出してOCR
============================================ */
async function readImages(){
  const files = document.getElementById("files").files;
  if(!files.length) return;

  document.getElementById("status").textContent = "OCR実行中…";

  for(const file of files){
    // 画像読み込み
    const img = await new Promise(res=>{
      const i = new Image();
      i.onload = ()=>res(i);
      i.src = URL.createObjectURL(file);
    });

    const W = img.naturalWidth;
    const H = img.naturalHeight;

    // 縦スクロールの行高さ推定
    const rowH = Math.floor(H / 8);

    const iconW = Math.floor(W * 0.18);
    const nameX = iconW + 20;
    const nameW = W - nameX - 20;

    for(let y=0; y<H; y+=rowH){
      // アイコン部分切り抜き
      const iconCrop = {x:10, y:y+10, w:iconW-20, h:rowH-20};
      const cIcon = document.createElement("canvas");
      cIcon.width = iconCrop.w;
      cIcon.height = iconCrop.h;
      cIcon.getContext("2d").drawImage(img,
        iconCrop.x, iconCrop.y, iconCrop.w, iconCrop.h,
        0,0,iconCrop.w,iconCrop.h
      );
      const iconData = cIcon.toDataURL();

      // 同盟名部分
      const textCrop = {x:nameX, y:y+10, w:nameW, h:rowH-20};
      const pre = preprocess(img, textCrop);
      const blob = await (await fetch(pre)).blob();

      const res = await Tesseract.recognize(blob, "jpn+eng");
      let name = res.data.text.trim().replace(/\s+/g,"");

      if(name.length >= 2 && name.length <= 20){
        addRow(name, iconData);
      }
    }
  }

  document.getElementById("status").textContent = "OCR完了！ 必要に応じて修正できます。";
}
</script>
</body>
</html>
